<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>预训练：基础模型</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===========================================
         CSS CUSTOM PROPERTIES (THEME)
         =========================================== */
      :root {
        --bg-primary: #f4efe6;
        --bg-secondary: #fffaf0;
        --ink: #14110f;
        --muted: #756f67;
        --line: #d7cabb;
        --accent: #007c89;
        --accent-2: #c6422f;
        --accent-3: #e8b54a;
        --shadow: rgba(30, 22, 14, 0.14);
        --font-display: "Noto Serif SC", serif;
        --font-body: "IBM Plex Sans SC", sans-serif;
        --title-size: clamp(1.5rem, 5vw, 4rem);
        --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
        --h3-size: clamp(1rem, 2.5vw, 1.75rem);
        --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
        --small-size: clamp(0.65rem, 1vw, 0.875rem);
        --slide-padding: clamp(1rem, 4vw, 4rem);
        --content-gap: clamp(0.5rem, 2vw, 2rem);
        --element-gap: clamp(0.25rem, 1vw, 1rem);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ===========================================
         BASE RESET
         =========================================== */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ===========================================
         VIEWPORT FITTING: MANDATORY BASE STYLES
         Include this ENTIRE file in every presentation.
         These styles ensure slides fit exactly in the viewport.
         =========================================== */

      /* 1. Lock html/body to viewport */
      html, body {
          height: 100%;
          overflow-x: hidden;
      }

      html {
          scroll-snap-type: y mandatory;
          scroll-behavior: smooth;
      }

      /* 2. Each slide = exact viewport height */
      .slide {
          width: 100vw;
          height: 100vh;
          height: 100dvh; /* Dynamic viewport height for mobile browsers */
          overflow: hidden; /* CRITICAL: Prevent ANY overflow */
          scroll-snap-align: start;
          display: flex;
          flex-direction: column;
          position: relative;
      }

      /* 3. Content container with flex for centering */
      .slide-content {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          max-height: 100%;
          overflow: hidden; /* Double-protection against overflow */
          padding: var(--slide-padding);
      }

      /* 4. ALL typography uses clamp() for responsive scaling */
      :root {
          /* Titles scale from mobile to desktop */
          --title-size: clamp(1.5rem, 5vw, 4rem);
          --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
          --h3-size: clamp(1rem, 2.5vw, 1.75rem);

          /* Body text */
          --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
          --small-size: clamp(0.65rem, 1vw, 0.875rem);

          /* Spacing scales with viewport */
          --slide-padding: clamp(1rem, 4vw, 4rem);
          --content-gap: clamp(0.5rem, 2vw, 2rem);
          --element-gap: clamp(0.25rem, 1vw, 1rem);
      }

      /* 5. Cards/containers use viewport-relative max sizes */
      .card, .container, .content-box {
          max-width: min(90vw, 1000px);
          max-height: min(80vh, 700px);
      }

      /* 6. Lists auto-scale with viewport */
      .feature-list, .bullet-list {
          gap: clamp(0.4rem, 1vh, 1rem);
      }

      .feature-list li, .bullet-list li {
          font-size: var(--body-size);
          line-height: 1.4;
      }

      /* 7. Grids adapt to available space */
      .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
          gap: clamp(0.5rem, 1.5vw, 1rem);
      }

      /* 8. Images constrained to viewport */
      img, .image-container {
          max-width: 100%;
          max-height: min(50vh, 400px);
          object-fit: contain;
      }

      /* ===========================================
         RESPONSIVE BREAKPOINTS
         Aggressive scaling for smaller viewports
         =========================================== */

      /* Short viewports (< 700px height) */
      @media (max-height: 700px) {
          :root {
              --slide-padding: clamp(0.75rem, 3vw, 2rem);
              --content-gap: clamp(0.4rem, 1.5vw, 1rem);
              --title-size: clamp(1.25rem, 4.5vw, 2.5rem);
              --h2-size: clamp(1rem, 3vw, 1.75rem);
          }
      }

      /* Very short viewports (< 600px height) */
      @media (max-height: 600px) {
          :root {
              --slide-padding: clamp(0.5rem, 2.5vw, 1.5rem);
              --content-gap: clamp(0.3rem, 1vw, 0.75rem);
              --title-size: clamp(1.1rem, 4vw, 2rem);
              --body-size: clamp(0.7rem, 1.2vw, 0.95rem);
          }

          /* Hide non-essential elements */
          .nav-dots, .keyboard-hint, .decorative {
              display: none;
          }
      }

      /* Extremely short (landscape phones, < 500px height) */
      @media (max-height: 500px) {
          :root {
              --slide-padding: clamp(0.4rem, 2vw, 1rem);
              --title-size: clamp(1rem, 3.5vw, 1.5rem);
              --h2-size: clamp(0.9rem, 2.5vw, 1.25rem);
              --body-size: clamp(0.65rem, 1vw, 0.85rem);
          }
      }

      /* Narrow viewports (< 600px width) */
      @media (max-width: 600px) {
          :root {
              --title-size: clamp(1.25rem, 7vw, 2.5rem);
          }

          /* Stack grids vertically */
          .grid {
              grid-template-columns: 1fr;
          }
      }

      /* ===========================================
         REDUCED MOTION
         Respect user preferences
         =========================================== */
      @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
              animation-duration: 0.01ms !important;
              transition-duration: 0.2s !important;
          }

          html {
              scroll-behavior: auto;
          }
      }

      /* ===========================================
         GLOBAL SLIDE STYLE
         =========================================== */
      body {
        background: var(--bg-primary);
        color: var(--ink);
        font-family: var(--font-body);
        overflow: hidden;
      }

      .slide {
        background:
          linear-gradient(90deg, rgba(20, 17, 15, 0.045) 1px, transparent 1px),
          linear-gradient(rgba(20, 17, 15, 0.035) 1px, transparent 1px),
          radial-gradient(circle at 85% 12%, rgba(0, 124, 137, 0.14), transparent 28%),
          radial-gradient(circle at 8% 85%, rgba(198, 66, 47, 0.12), transparent 32%),
          var(--bg-primary);
        background-size: clamp(28px, 4vw, 56px) clamp(28px, 4vw, 56px), clamp(28px, 4vw, 56px) clamp(28px, 4vw, 56px), auto, auto, auto;
      }

      .slide::before {
        content: "";
        position: absolute;
        inset: clamp(0.5rem, 1.2vw, 1rem);
        border: 1px solid rgba(20, 17, 15, 0.18);
        pointer-events: none;
      }

      .slide-content {
        justify-content: flex-start;
        gap: clamp(0.65rem, 1.6vw, 1.4rem);
      }

      h1,
      h2,
      h3 {
        font-family: var(--font-display);
        letter-spacing: 0;
      }

      .deck-title {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: var(--element-gap);
        width: min(100%, 1160px);
        margin: 0 auto;
      }

      h1 {
        font-size: clamp(1.55rem, 4vw, 3.25rem);
        line-height: 1.05;
      }

      .step-counter {
        color: var(--muted);
        font-size: var(--small-size);
        font-weight: 700;
      }

      .module {
        width: min(100%, 1160px);
        margin: 0 auto;
        border: 1px solid var(--line);
        background: rgba(255, 250, 240, 0.86);
        box-shadow: 0 clamp(10px, 2vw, 26px) clamp(20px, 4vw, 46px) var(--shadow);
        padding: clamp(0.7rem, 1.8vw, 1.45rem);
      }

      .module-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: clamp(0.45rem, 0.9vw, 0.7rem);
        gap: var(--element-gap);
      }

      .module-title {
        font-size: clamp(0.95rem, 1.9vw, 1.45rem);
        font-weight: 700;
      }

      .module-caption {
        color: var(--muted);
        font-size: var(--small-size);
      }

      /* ===========================================
         PROCESS MODULE
         =========================================== */
      .process-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(0.45rem, 1.25vw, 1.1rem);
        margin-top: clamp(0.65rem, 1.35vw, 1.1rem);
      }

      .node {
        min-height: clamp(58px, 10vh, 88px);
        border: 1px solid var(--line);
        background: var(--bg-secondary);
        padding: clamp(0.55rem, 1.2vw, 0.9rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        visibility: hidden;
        opacity: 0;
        transform: translateY(clamp(8px, 1.2vw, 16px)) scale(0.98);
        transition:
          visibility 0s linear 0.45s,
          opacity 0.45s var(--ease),
          transform 0.45s var(--ease),
          border-color 0.45s var(--ease);
      }

      .node.visible-node {
        visibility: visible;
        opacity: 1;
        transform: translateY(0) scale(1);
        transition-delay: 0s;
      }

      .node.current-node {
        border-color: var(--accent);
        box-shadow: inset 0 clamp(3px, 0.5vw, 5px) 0 var(--accent);
      }

      .node-title {
        font-weight: 700;
        font-size: clamp(0.72rem, 1.25vw, 1rem);
      }

      .node-note {
        color: var(--muted);
        font-size: clamp(0.58rem, 0.9vw, 0.78rem);
      }

      .node-arrow {
        position: absolute;
        right: calc(-1 * clamp(0.75rem, 1.75vw, 1.35rem));
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-2);
        font-size: clamp(1rem, 2.4vw, 1.9rem);
        font-weight: 700;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.35s var(--ease), visibility 0s linear 0.35s;
        z-index: 4;
      }

      .node.visible-node .node-arrow {
        visibility: visible;
        opacity: 1;
        transition-delay: 0s;
      }

      .node:last-child .node-arrow {
        display: none;
      }

      .process-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(190px, 0.42fr);
        gap: clamp(0.65rem, 1.6vw, 1.25rem);
        margin-top: clamp(0.65rem, 1.35vw, 1.1rem);
        align-items: center;
      }

      .stage-visual {
        width: min(100%, calc(min(46vh, 380px) * 1.5));
        aspect-ratio: 3 / 2;
        justify-self: center;
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(0, 124, 137, 0.08), transparent 42%),
          rgba(255, 250, 240, 0.68);
        position: relative;
        overflow: hidden;
      }

      .visual-scene {
        position: absolute;
        inset: 0;
        visibility: hidden;
        opacity: 0;
        transform: translateY(clamp(10px, 1.5vw, 18px));
        transition:
          visibility 0s linear 0.35s,
          opacity 0.35s var(--ease),
          transform 0.35s var(--ease);
      }

      .visual-scene.active-scene {
        visibility: visible;
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0s;
      }

      .scene-image {
        width: 100%;
        height: 100%;
        max-height: none;
        object-fit: contain;
        display: block;
        filter: saturate(0.96) contrast(1.02);
      }

      .active-scene .scene-image {
        animation: imageSettle 0.75s var(--ease) both;
      }

      .stage-copy {
        border-left: clamp(3px, 0.6vw, 6px) solid var(--accent);
        padding: clamp(0.65rem, 1.4vw, 1.05rem);
        background: rgba(244, 239, 230, 0.72);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(0.35rem, 0.8vw, 0.6rem);
        min-height: clamp(120px, 22vh, 210px);
      }

      .stage-copy h3 {
        font-size: clamp(0.9rem, 1.7vw, 1.25rem);
      }

      .stage-copy p {
        color: var(--muted);
        font-size: clamp(0.68rem, 1.2vw, 0.95rem);
        line-height: 1.5;
      }

      /* ===========================================
         CSS VISUALS FOR EACH NODE
         =========================================== */
      .doc {
        position: absolute;
        width: clamp(42px, 7vw, 80px);
        height: clamp(54px, 10vw, 104px);
        border: 1px solid var(--line);
        background: #fffdf6;
        box-shadow: 0 10px 22px rgba(20, 17, 15, 0.12);
        animation: collectDocs 3.2s var(--ease) infinite;
      }

      .doc::before,
      .doc::after {
        content: "";
        position: absolute;
        left: 18%;
        right: 18%;
        height: 1px;
        background: rgba(20, 17, 15, 0.22);
      }

      .doc::before {
        top: 35%;
      }

      .doc::after {
        top: 55%;
      }

      .doc.one { left: 10%; top: 15%; animation-delay: 0s; }
      .doc.two { left: 31%; top: 50%; animation-delay: 0.35s; }
      .doc.three { left: 63%; top: 21%; animation-delay: 0.7s; }

      .corpus-basin {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: clamp(125px, 20vw, 230px);
        height: clamp(38px, 6vh, 66px);
        border: 2px solid var(--accent);
        border-top: 0;
      }

      .sentence {
        position: absolute;
        left: 8%;
        top: 18%;
        font-size: clamp(0.78rem, 1.5vw, 1.08rem);
        font-weight: 600;
      }

      .token-track {
        position: absolute;
        inset: 44% 7% auto 7%;
        display: flex;
        gap: clamp(0.3rem, 0.8vw, 0.7rem);
        flex-wrap: wrap;
      }

      .token {
        background: var(--accent);
        color: white;
        padding: clamp(0.32rem, 0.7vw, 0.52rem) clamp(0.46rem, 0.9vw, 0.8rem);
        font-weight: 700;
        font-size: clamp(0.62rem, 1vw, 0.88rem);
        animation: tokenPop 2.2s var(--ease) infinite;
      }

      .token:nth-child(2) { animation-delay: 0.18s; }
      .token:nth-child(3) { animation-delay: 0.36s; }
      .token:nth-child(4) { animation-delay: 0.54s; }

      .id-row {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 14%;
        color: var(--accent-2);
        font-weight: 700;
        font-size: clamp(0.68rem, 1.2vw, 0.96rem);
      }

      .network {
        position: absolute;
        inset: 12% 10%;
      }

      .neuron {
        position: absolute;
        width: clamp(14px, 1.8vw, 22px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 clamp(5px, 0.9vw, 10px) rgba(0, 124, 137, 0.12);
        animation: pulse 1.9s ease-in-out infinite;
      }

      .n1 { left: 8%; top: 22%; }
      .n2 { left: 8%; top: 62%; animation-delay: 0.2s; }
      .n3 { left: 42%; top: 18%; animation-delay: 0.4s; }
      .n4 { left: 42%; top: 66%; animation-delay: 0.6s; }
      .n5 { left: 78%; top: 42%; animation-delay: 0.8s; }

      .edge {
        position: absolute;
        height: 2px;
        background: rgba(198, 66, 47, 0.42);
        transform-origin: left center;
        animation: edgeFlow 1.9s linear infinite;
      }

      .e1 { left: 13%; top: 27%; width: 32%; transform: rotate(0.2rad); }
      .e2 { left: 13%; top: 67%; width: 32%; transform: rotate(-0.25rad); }
      .e3 { left: 47%; top: 24%; width: 34%; transform: rotate(0.35rad); }
      .e4 { left: 47%; top: 70%; width: 34%; transform: rotate(-0.42rad); }

      .prob-bars {
        position: absolute;
        right: 8%;
        bottom: 11%;
        display: flex;
        align-items: end;
        gap: clamp(0.25rem, 0.65vw, 0.5rem);
        height: clamp(62px, 13vh, 115px);
      }

      .bar {
        width: clamp(14px, 2vw, 25px);
        background: var(--accent-3);
        animation: barRise 2s var(--ease) infinite;
      }

      .bar:nth-child(1) { height: 42%; }
      .bar:nth-child(2) { height: 68%; animation-delay: 0.2s; }
      .bar:nth-child(3) { height: 92%; animation-delay: 0.4s; background: var(--accent-2); }
      .bar:nth-child(4) { height: 52%; animation-delay: 0.6s; }

      .type-line {
        position: absolute;
        left: 9%;
        top: 18%;
        width: 82%;
        color: var(--ink);
        font-size: clamp(0.9rem, 1.75vw, 1.42rem);
        font-weight: 700;
        line-height: 1.8;
      }

      .generated-token {
        display: inline-block;
        color: white;
        background: var(--accent-2);
        padding: 0 clamp(0.25rem, 0.55vw, 0.45rem);
        animation: generatedBlink 1.4s ease-in-out infinite;
      }

      .cursor {
        display: inline-block;
        width: 0.08em;
        height: 1em;
        background: var(--accent);
        vertical-align: -0.14em;
        animation: cursorBlink 0.9s steps(2) infinite;
      }

      .context-stack {
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 15%;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: clamp(0.3rem, 0.7vw, 0.62rem);
      }

      .context-stack span {
        border: 1px solid var(--line);
        background: #fffdf6;
        padding: clamp(0.32rem, 0.6vw, 0.5rem);
        text-align: center;
        font-weight: 700;
        font-size: clamp(0.58rem, 0.9vw, 0.76rem);
      }

      /* ===========================================
         FEATURES MODULE
         =========================================== */
      .features-module {
        display: none;
        opacity: 0;
        transform: translateY(clamp(12px, 1.8vw, 22px));
      }

      .features-module.visible-features {
        display: block;
        opacity: 1;
        transform: translateY(0);
        animation: moduleIn 0.5s var(--ease) both;
      }

      .feature-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(0.42rem, 1vw, 0.8rem);
        margin-top: clamp(0.55rem, 1.1vw, 0.85rem);
      }

      .feature {
        border: 1px solid var(--line);
        background: #fffdf6;
        padding: clamp(0.55rem, 1.1vw, 0.8rem);
        min-height: clamp(48px, 8vh, 72px);
        display: grid;
        place-items: center;
        text-align: center;
        font-weight: 700;
        font-size: clamp(0.68rem, 1.1vw, 0.9rem);
        opacity: 0;
        transform: translateY(clamp(8px, 1.2vw, 14px));
      }

      .visible-features .feature {
        animation: featureIn 0.6s var(--ease) forwards;
      }

      .feature:nth-child(2) { animation-delay: 0.12s; }
      .feature:nth-child(3) { animation-delay: 0.24s; }
      .feature:nth-child(4) { animation-delay: 0.36s; }

      /* ===========================================
         STEP CONTROLS
         =========================================== */
      .step-controls {
        position: fixed;
        right: clamp(0.8rem, 1.7vw, 1.4rem);
        bottom: clamp(0.8rem, 1.7vw, 1.4rem);
        display: flex;
        gap: clamp(0.35rem, 0.8vw, 0.6rem);
        z-index: 10;
      }

      .step-controls button {
        width: clamp(34px, 4vw, 46px);
        aspect-ratio: 1;
        border: 1px solid var(--accent);
        background: rgba(255, 250, 240, 0.9);
        color: var(--accent);
        font-size: clamp(1rem, 1.8vw, 1.35rem);
        font-weight: 700;
        cursor: pointer;
      }

      .step-controls button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .keyboard-hint {
        position: fixed;
        left: clamp(0.8rem, 1.8vw, 1.4rem);
        bottom: clamp(0.8rem, 1.7vw, 1.4rem);
        color: rgba(20, 17, 15, 0.52);
        font-size: var(--small-size);
        z-index: 10;
      }

      @keyframes collectDocs {
        0%, 100% { transform: translate(0, 0) rotate(-4deg); opacity: 0.65; }
        55% { transform: translate(clamp(22px, 6vw, 80px), clamp(20px, 6vh, 58px)) rotate(3deg); opacity: 1; }
      }

      @keyframes tokenPop {
        0%, 100% { transform: translateY(0); }
        45% { transform: translateY(calc(-1 * clamp(5px, 1vw, 10px))); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
      }

      @keyframes edgeFlow {
        0%, 100% { opacity: 0.2; }
        45% { opacity: 0.9; }
      }

      @keyframes barRise {
        0%, 100% { transform: scaleY(0.82); transform-origin: bottom; }
        50% { transform: scaleY(1); transform-origin: bottom; }
      }

      @keyframes generatedBlink {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.18); }
      }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes featureIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes moduleIn {
        from {
          opacity: 0;
          transform: translateY(clamp(12px, 1.8vw, 22px));
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes imageSettle {
        from {
          opacity: 0;
          transform: scale(1.025);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ===========================================
         RESPONSIVE CUSTOM LAYOUTS
         =========================================== */
      @media (max-width: 840px) {
        .deck-title {
          align-items: start;
          flex-direction: column;
        }

        .process-stage {
          grid-template-columns: 1fr;
        }

        .stage-copy {
          min-height: auto;
        }

        .process-row,
        .feature-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .node:nth-child(2) .node-arrow {
          display: none;
        }
      }

      @media (max-height: 640px) {
        .slide-content {
          gap: clamp(0.35rem, 0.8vw, 0.7rem);
        }

        .module {
          padding: clamp(0.5rem, 1.1vw, 0.85rem);
        }

        .stage-visual,
        .stage-copy {
          min-height: auto;
        }

        .node {
          min-height: clamp(52px, 10vh, 76px);
        }

        .feature {
          min-height: clamp(38px, 7vh, 56px);
        }
      }

      .slide[data-step="5"] .process-stage {
        display: none;
      }
    </style>
  </head>
  <body>
    <section class="slide" data-step="0">
      <div class="slide-content">
        <header class="deck-title">
          <h1>预训练：基础模型</h1>
          <div class="step-counter" id="stepCounter">Step 0 / 5</div>
        </header>

        <main class="module process-module">
          <div class="module-header">
            <h2 class="module-title">预训练流程</h2>
            <span class="module-caption" id="processCaption">按空格逐步展示流程节点</span>
          </div>

          <div class="process-row" aria-label="预训练流程">
            <div class="node" data-node="1">
              <span class="node-title">语料收集与预处理</span>
              <span class="node-note">互联网文本 · 清洗去重</span>
              <span class="node-arrow" aria-hidden="true">→</span>
            </div>
            <div class="node" data-node="2">
              <span class="node-title">分词编码</span>
              <span class="node-note">token → ID</span>
              <span class="node-arrow" aria-hidden="true">→</span>
            </div>
            <div class="node" data-node="3">
              <span class="node-title">模型训练</span>
              <span class="node-note">next token</span>
              <span class="node-arrow" aria-hidden="true">→</span>
            </div>
            <div class="node" data-node="4">
              <span class="node-title">自回归生成</span>
              <span class="node-note">逐步生成</span>
            </div>
          </div>

          <div class="process-stage">
            <div class="stage-visual" aria-hidden="true">
              <div class="visual-scene" data-scene="1">
                <img
                  class="scene-image"
                  src="assets/corpus-preprocessing.png"
                  alt="大量互联网文档经过过滤与去重后汇聚为训练语料库"
                />
              </div>

              <div class="visual-scene" data-scene="2">
                <img
                  class="scene-image"
                  src="assets/tokenization-encoding.png"
                  alt="输入序列卢卡游被切分为 token 并映射为数字 ID"
                />
              </div>

              <div class="visual-scene" data-scene="3">
                <img
                  class="scene-image"
                  src="assets/model-training.png"
                  alt="卢卡游对应的 token ID 序列输入神经网络并预测下一个 token 记的概率"
                />
              </div>

              <div class="visual-scene" data-scene="4">
                <img
                  class="scene-image"
                  src="assets/autoregressive-generation.png"
                  alt="模型根据上下文卢卡游预测新 token 记并将其接入后续生成过程"
                />
              </div>
            </div>

            <aside class="stage-copy">
              <h3 id="stageTitle">预训练流程</h3>
              <p id="stageText">流程模块先出现；后续节点将在同一张 slide 中逐步展开。</p>
            </aside>
          </div>
        </main>

        <section class="module features-module" id="featuresModule">
          <div class="module-header">
            <h2 class="module-title">特点</h2>
            <span class="module-caption">模块二</span>
          </div>
          <div class="feature-grid">
            <div class="feature">文本建模</div>
            <div class="feature">概率生成</div>
            <div class="feature">语料模式</div>
            <div class="feature">few-shot 迁移</div>
          </div>
        </section>
      </div>
    </section>

    <div class="keyboard-hint">方向键 / 空格：推进或回退</div>
    <div class="step-controls" aria-label="步骤控制">
      <button id="prevStep" type="button" aria-label="上一步">‹</button>
      <button id="nextStep" type="button" aria-label="下一步">›</button>
    </div>

    <script>
      /* ===========================================
         SINGLE-SLIDE STEP CONTROLLER
         =========================================== */
      class SingleSlideFlow {
        constructor() {
          this.currentStep = 0;
          this.maxStep = 5;
          this.slide = document.querySelector(".slide");
          this.nodes = Array.from(document.querySelectorAll(".node"));
          this.scenes = Array.from(document.querySelectorAll(".visual-scene"));
          this.features = document.querySelector("#featuresModule");
          this.counter = document.querySelector("#stepCounter");
          this.caption = document.querySelector("#processCaption");
          this.stageTitle = document.querySelector("#stageTitle");
          this.stageText = document.querySelector("#stageText");
          this.prevButton = document.querySelector("#prevStep");
          this.nextButton = document.querySelector("#nextStep");
          this.copy = [
            {
              title: "预训练流程",
              text: "流程模块先出现；后续节点将在同一张 slide 中逐步展开。",
              caption: "按空格逐步展示流程节点"
            },
            {
              title: "语料收集与预处理",
              text: "大规模文本被收集、清洗、去重，并整理为可训练语料。",
              caption: "节点 1：语料进入训练管线"
            },
            {
              title: "分词编码",
              text: "输入序列“卢卡游”被切分为 token，并通过词表映射为模型可处理的整数 ID。",
              caption: "节点 2：文本转换为 token ID"
            },
            {
              title: "模型训练",
              text: "模型根据“卢卡游”的 token 序列，学习预测下一个 token 的概率分布。",
              caption: "节点 3：学习 next token 预测"
            },
            {
              title: "自回归生成",
              text: "模型预测下一个 token 为“记”，再将其并入上下文继续生成。",
              caption: "节点 4：逐步生成文本"
            },
            {
              title: "自回归生成",
              text: "流程完成后，特点模块出现，用关键词概括基础模型能力。",
              caption: "特点模块出现"
            }
          ];

          this.bindEvents();
          this.render();
        }

        bindEvents() {
          this.prevButton.addEventListener("click", () => this.go(-1));
          this.nextButton.addEventListener("click", () => this.go(1));

          window.addEventListener("keydown", (event) => {
            const nextKeys = ["ArrowDown", "ArrowRight", " ", "PageDown"];
            const prevKeys = ["ArrowUp", "ArrowLeft", "PageUp"];
            if (nextKeys.includes(event.key)) {
              event.preventDefault();
              this.go(1);
            }
            if (prevKeys.includes(event.key)) {
              event.preventDefault();
              this.go(-1);
            }
          });

          let startY = 0;
          window.addEventListener("touchstart", (event) => {
            startY = event.touches[0].clientY;
          }, { passive: true });

          window.addEventListener("touchend", (event) => {
            const delta = startY - event.changedTouches[0].clientY;
            if (Math.abs(delta) < 42) return;
            this.go(delta > 0 ? 1 : -1);
          }, { passive: true });
        }

        go(direction) {
          this.currentStep = Math.max(0, Math.min(this.currentStep + direction, this.maxStep));
          this.render();
        }

        render() {
          const activeNode = Math.min(this.currentStep, 4);
          this.slide.dataset.step = String(this.currentStep);

          this.nodes.forEach((node) => {
            const nodeStep = Number(node.dataset.node);
            node.classList.toggle("visible-node", this.currentStep >= nodeStep);
            node.classList.toggle("current-node", nodeStep === activeNode && this.currentStep > 0);
          });

          this.scenes.forEach((scene) => {
            const sceneStep = Number(scene.dataset.scene);
            scene.classList.toggle("active-scene", sceneStep === activeNode && this.currentStep > 0);
          });

          this.features.classList.toggle("visible-features", this.currentStep === 5);
          this.counter.textContent = `Step ${this.currentStep} / ${this.maxStep}`;
          this.caption.textContent = this.copy[this.currentStep].caption;
          this.stageTitle.textContent = this.copy[this.currentStep].title;
          this.stageText.textContent = this.copy[this.currentStep].text;
          this.prevButton.disabled = this.currentStep === 0;
          this.nextButton.disabled = this.currentStep === this.maxStep;
        }
      }

      new SingleSlideFlow();
    </script>
  </body>
</html>
